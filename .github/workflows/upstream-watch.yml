name: Upstream Watch

on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_REPO: kaitranntt/ccs
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Fetch upstream tags
        run: git fetch --no-tags "https://github.com/${UPSTREAM_REPO}.git" '+refs/tags/*:refs/tags/*'

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2

      - name: Resolve upstream's latest stable release
        id: latest
        run: |
          tag=$(gh release view --repo "$UPSTREAM_REPO" --json tagName --jq .tagName)
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "unexpected latest release tag: $tag" >&2
            exit 1
          fi
          version=$(jq -r .version package.json)
          base="${version%-retso.*}"
          newest=$(printf '%s\n%s\n' "${tag#v}" "$base" | sort -V | tail -n 1)
          if [ "${tag#v}" = "$base" ] || [ "$newest" != "${tag#v}" ]; then
            echo "no newer stable release (upstream latest $tag, fork base v$base)"
            echo "newer=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "newer=true" >> "$GITHUB_OUTPUT"

      - name: Test rebase and report through a failed run
        if: steps.latest.outputs.newer == 'true'
        env:
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          .github/upstream-watch/watch.sh --tag "$TAG" > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          result=$(sed -n 's/^\*\*Result:\*\* //p' report.md | head -n 1)
          echo "Upstream $TAG: $result"
          exit 1
